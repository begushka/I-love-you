<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
        <title>Heart Landing</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background-color: #0d0d0d;
                color: #00ffcc;
                font-family: 'Courier New', Courier, monospace;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                overflow: hidden;
            }
            .container {
                text-align: center;
                z-index: 10;
            }
            .status {
                font-size: 14px;
                color: #888;
                margin-bottom: 20px;
            }
            .btn-decrypt {
                background: transparent;
                border: 1px solid #ff2a5f;
                color: #ff2a5f;
                padding: 12px 24px;
                font-family: inherit;
                font-weight: bold;
                cursor: pointer;
                border-radius: 4px;
                box-shadow: 0 0 10px rgba(255, 42, 95, 0.3);
                transition: 0.3s;
            }
            .btn-decrypt:hover {
                background: #ff2a5f;
                color: #fff;
                box-shadow: 0 0 20px rgba(255, 42, 95, 0.8);
            }
            #heart-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                pointer-events: none;
            }
            .heart-text {
                position: absolute;
                font-weight: bold;
                color: #ff2a5f;
                text-shadow: 0 0 5px #ff2a5f, 0 0 10px #ff0040;
                opacity: 0;
                transition: opacity 0.5s ease-in-out;
                white-space: nowrap;
                transform: translate(-50%, -50%);
            }
        </style>
    </head>
    <body>
        <div class="container" id="main-ui">
            <div class="status">[system] Initializing heart.PROTOCOL_v2.0...</div>
            <p style="color: #ccc; margin-bottom: 15px;">> One encrypted package found for you.</p>
            <button class="btn-decrypt" onclick="startDecrypt()">DECRYPT MESSAGE</button>
        </div>
        <div id="heart-container"></div>
        <script>
            function startDecrypt() {
                document.getElementById('main-ui').style.display = 'none';
                const container = document.getElementById('heart-container');
                
                const totalPoints = 250;
                const textToRepeat = "I love you ";
                
                // Ajusta a escala dinamicamente para caber na menor dimensão da tela
                const minDimension = Math.min(window.innerWidth, window.innerHeight);
                const scale = minDimension / 42; 
                const fontSize = window.innerWidth < 600 ? '7px' : '11px';
                
                for (let i = 0; i < totalPoints; i++) {
                    const t = (i / totalPoints) * Math.PI * 2;
                    
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    const span = document.createElement('span');
                    span.className = 'heart-text';
                    span.innerText = textToRepeat;
                    span.style.fontSize = fontSize;
                    const posX = window.innerWidth / 2 + x * scale;
                    const posY = window.innerHeight / 2 + y * scale;
                    span.style.left = `${posX}px`;
                    span.style.top = `${posY}px`;
                    container.appendChild(span);
                    setTimeout(() => {
                    span.style.opacity = '1';
                    }, i * 10);
                }
            }
        </script>
    </body>
</html>
